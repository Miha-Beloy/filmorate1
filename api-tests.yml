name: API Tests

on:
  # Запускать этот workflow при пуше в ветку develop1
  push:
    branches: [ develop1 ]
  # И при создании Pull Request, который хочет влиться в develop1
  pull_request:
    branches: [ develop1 ]

jobs:
  build:
    # Запускать на последней версии Ubuntu
    runs-on: ubuntu-latest

    steps:
      # 1. Шаг: Загрузить код из репозитория
      - uses: actions/checkout@v3

      # 2. Шаг: Настроить Java (укажите вашу версию, например, 11 или 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Шаг: Запустить Maven-тесты
      - name: Run tests with Maven
        run: mvn clean test